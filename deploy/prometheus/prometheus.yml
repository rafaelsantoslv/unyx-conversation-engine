global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'conversation-engine-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'conversation-engine-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'conversation-engine-outbound'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8082']
